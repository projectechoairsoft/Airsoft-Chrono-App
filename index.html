<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Echo Airsoft Calculator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border-color: #334155;
      --danger: #ef4444;
      --paypal-blue: #0070ba;
      --paypal-hover: #005ea6;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
      font-size: 1.5em;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 25px;
      color: var(--text-main);
    }

    .section-title {
      font-size: 1.1em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      text-transform: uppercase;
    }

    .input-group { margin-bottom: 22px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 16px;
      background-color: var(--bg-color);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input.text-input {
      font-size: 16px;
      text-align: left;
      padding: 12px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    input:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    select {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--bg-color);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    
    select optgroup {
      background-color: var(--card-bg);
      color: var(--text-muted);
      font-style: normal;
      font-weight: 600;
    }

    select option {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-weight: 700;
    }

    select:focus {
      border-color: var(--accent);
      outline: none;
    }

    .presets {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .preset-btn {
      flex: 1;
      padding: 12px 0;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover, .preset-btn:active {
      background: var(--border-color);
      color: var(--text-main);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    
    .primary-btn:hover { background-color: var(--accent-hover); }
    
    .secondary-btn {
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }
    .secondary-btn:hover {
      background-color: var(--border-color);
    }

    .status-banner {
      margin-top: 30px;
      padding: 18px;
      text-align: center;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1.1em;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .loadout-item, .shot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-color);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }

    .shot-item {
      padding: 8px 12px;
      font-size: 0.9em;
    }

    .shot-number {
      font-weight: 700;
      color: var(--accent);
      width: 30px;
    }

    .shot-stats {
      font-weight: 600;
    }

    .log-averages {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      margin-bottom: 15px;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 8px;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9em;
    }

    .loadout-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85em;
      color: var(--text-muted);
    }

    .loadout-name {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.1em;
      text-transform: uppercase;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8em;
      cursor: pointer;
      color: #fff;
    }

    .btn-load { background-color: var(--border-color); }
    .btn-load:hover { background-color: #475569; }
    
    .btn-delete { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .btn-delete:hover { background-color: var(--danger); color: #fff; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9em;
      font-style: italic;
      padding: 10px 0;
    }

    .donate-card {
      text-align: center;
      padding: 25px;
      margin-bottom: 40px;
    }
    .donate-text {
      font-size: 0.9em;
      color: var(--text-muted);
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .donate-btn {
      background-color: var(--paypal-blue);
      color: white;
    }
    .donate-btn:hover {
      background-color: var(--paypal-hover);
    }
  </style>
</head>
<body>

  <!-- CALCULATOR CARD -->
  <div class="card">
    <h2>Project Echo Airsoft Calculator</h2>
    
    <!-- FIELD LIMIT PRESETS -->
    <div class="input-group">
      <label>Active Ruleset</label>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <select id="limitSelect" onchange="changeLimit()" style="flex: 1;">
          <!-- Options populate via JavaScript -->
        </select>
        <button id="deleteLimitBtn" class="action-btn btn-delete" style="display:none;" onclick="deleteLimit()">X</button>
        <button class="action-btn" style="background: var(--accent); color: #0f172a; padding: 0 15px;" onclick="toggleLimitForm()">+ NEW</button>
      </div>

      <!-- Hidden form to add custom field/class rule -->
      <div id="newLimitForm" style="display: none; padding: 15px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 12px;">
        <label style="margin-top: 0;">Add Custom Preset</label>
        <input type="text" id="limitField" class="text-input" placeholder="Field/Event (e.g. MSW)">
        <input type="text" id="limitClass" class="text-input" placeholder="Weapon Class (e.g. LMG)">
        <input type="number" id="limitJoules" class="text-input" placeholder="Max Joules (e.g. 1.5)" step="0.01">
        <button class="primary-btn" onclick="saveLimit()" style="padding: 10px; font-size: 14px;">Save Ruleset</button>
      </div>
    </div>

    <!-- MAIN CALCULATOR -->
    <div class="input-group">
      <label>BB Weight (Grams)</label>
      <div class="presets">
        <button class="preset-btn" onclick="setWeight(0.20)">.20g</button>
        <button class="preset-btn" onclick="setWeight(0.25)">.25g</button>
        <button class="preset-btn" onclick="setWeight(0.28)">.28g</button>
        <button class="preset-btn" onclick="setWeight(0.32)">.32g</button>
      </div>
      <input type="number" id="weight" value="0.20" step="0.01">
    </div>

    <div class="input-group">
      <label for="fps">Velocity (FPS)</label>
      <input type="number" id="fps" value="350" step="1">
    </div>

    <div class="input-group">
      <label for="joules">Energy (Joules)</label>
      <input type="number" id="joules" value="1.14" step="0.01">
    </div>

    <div id="statusBanner" class="status-banner">
      Calculating...
    </div>
  </div>

  <!-- CHRONO LOG CARD -->
  <div class="card">
    <div class="section-title">CHRONO LOG (LAST 10 SHOTS)</div>
    
    <button class="primary-btn" onclick="logShot()" style="margin-bottom: 15px;">Log Current Shot</button>
    
    <div id="logAverages" class="log-averages" style="display: none;">
      <span>Avg FPS: <span id="avgFps">0</span></span>
      <span>Avg Joules: <span id="avgJoules">0.00</span></span>
    </div>

    <div id="shotList">
      <!-- Logged shots will appear here -->
    </div>
    <div id="emptyLogState" class="empty-state">No shots logged yet.</div>

    <button id="clearLogBtn" class="primary-btn secondary-btn" onclick="clearLog()" style="display: none;">Clear Log</button>
  </div>

  <!-- ARMORY / SAVED PROFILES CARD -->
  <div class="card">
    <div class="section-title">THE ARMORY (GUN PROFILES)</div>
    
    <div class="input-group">
      <input type="text" id="profileName" class="text-input" placeholder="e.g. VSR-10 Sniper, M4 CQB">
      <button class="primary-btn" onclick="saveProfile()">Save Current Stats</button>
    </div>

    <div id="loadoutList">
      <!-- Saved profiles will appear here -->
    </div>
    <div id="emptyArmoryState" class="empty-state">No saved profiles yet.</div>
  </div>

  <!-- DONATION CARD -->
  <div class="card donate-card">
    <div class="section-title" style="border:none; margin-bottom: 5px;">SUPPORT THE APP</div>
    <p class="donate-text">If you find this tool useful out on the field, consider helping keep it running!</p>
    
    <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
      <input type="hidden" name="cmd" value="_donations" />
      <input type="hidden" name="business" value="ProjectEchoAirsoft@gmail.com" />
      <input type="hidden" name="item_name" value="Project Echo Airsoft Calculator App Support" />
      <input type="hidden" name="currency_code" value="USD" />
      
      <button type="submit" class="primary-btn donate-btn">Donate via PayPal</button>
    </form>
  </div>

  <script>
    // --- BUILT-IN & CUSTOM FIELD LIMITS ---
    const builtInLimits = [
      { id: 'tca-smg', field: 'Third Coast Airsoft', weaponClass: 'SMG', max: 1.00 },
      { id: 'tca-rifle', field: 'Third Coast Airsoft', weaponClass: 'Rifle', max: 1.55 },
      { id: 'tca-pistol', field: 'Third Coast Airsoft', weaponClass: 'Pistol', max: 1.55 },
      { id: 'tca-spr', field: 'Third Coast Airsoft', weaponClass: 'SPR', max: 1.86 },
      { id: 'tca-lmg', field: 'Third Coast Airsoft', weaponClass: 'Support / LMG', max: 1.86 },
      { id: 'tca-dmr', field: 'Third Coast Airsoft', weaponClass: 'DMR', max: 2.10 },
      { id: 'tca-mmg', field: 'Third Coast Airsoft', weaponClass: 'Support / MMG', max: 2.12 },
      { id: 'tca-sniper', field: 'Third Coast Airsoft', weaponClass: 'Bolt Action Sniper', max: 3.60 }
    ];

    let customLimits = JSON.parse(localStorage.getItem('airsoftLimits')) || [];

    function renderLimits() {
      const select = document.getElementById('limitSelect');
      const currentValue = select.value;
      
      let html = '<option value="default">Standard Auto-Tiers (Default)</option>';
      
      html += '<optgroup label="Third Coast Airsoft (Uses 0.32g BBs)">';
      builtInLimits.forEach(limit => {
        html += `<option value="${limit.id}">${limit.weaponClass} (≤ ${limit.max.toFixed(2)}J)</option>`;
      });
      html += '</optgroup>';

      if (customLimits.length > 0) {
        html += '<optgroup label="Your Custom Rulesets">';
        customLimits.forEach(limit => {
          html += `<option value="${limit.id}">${limit.field} - ${limit.weaponClass} (≤ ${limit.max.toFixed(2)}J)</option>`;
        });
        html += '</optgroup>';
      }
      
      select.innerHTML = html;
      
      if ([...select.options].some(opt => opt.value === currentValue)) {
        select.value = currentValue;
      } else {
        select.value = 'default';
      }
      changeLimit();
    }

    function changeLimit() {
      const select = document.getElementById('limitSelect');
      const deleteBtn = document.getElementById('deleteLimitBtn');
      
      if (select.value === 'default' || select.value.startsWith('tca-')) {
        deleteBtn.style.display = 'none';
      } else {
        deleteBtn.style.display = 'block';
      }

      if (select.value.startsWith('tca-')) {
        document.getElementById('weight').value = "0.32";
      }

      updateJoules(); 
    }

    function toggleLimitForm() {
      const form = document.getElementById('newLimitForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function saveLimit() {
      const field = document.getElementById('limitField').value.trim();
      const weaponClass = document.getElementById('limitClass').value.trim();
      const max = parseFloat(document.getElementById('limitJoules').value);
      
      if (!field || !weaponClass || isNaN(max) || max <= 0) {
        alert("Please enter a valid Field, Weapon Class, and Maximum Joules.");
        return;
      }
      
      const newLimit = {
        id: Date.now().toString(),
        field: field,
        weaponClass: weaponClass,
        max: max
      };
      
      customLimits.push(newLimit);
      localStorage.setItem('airsoftLimits', JSON.stringify(customLimits));
      
      document.getElementById('limitField').value = '';
      document.getElementById('limitClass').value = '';
      document.getElementById('limitJoules').value = '';
      document.getElementById('newLimitForm').style.display = 'none';
      
      renderLimits();
      document.getElementById('limitSelect').value = newLimit.id;
      changeLimit();
    }

    function deleteLimit() {
      const select = document.getElementById('limitSelect');
      const idToDelete = select.value;
      if (idToDelete === 'default' || idToDelete.startsWith('tca-')) return; 
      
      if (confirm("Delete this custom ruleset?")) {
        customLimits = customLimits.filter(limit => limit.id !== idToDelete);
        localStorage.setItem('airsoftLimits', JSON.stringify(customLimits));
        renderLimits();
      }
    }


    // --- MAIN CALCULATOR LOGIC ---
    const fpsInput = document.getElementById('fps');
    const weightInput = document.getElementById('weight');
    const joulesInput = document.getElementById('joules');
    const statusBanner = document.getElementById('statusBanner');

    function setWeight(w) {
      weightInput.value = w.toFixed(2);
      updateJoules();
    }

    function updateStatus(joules) {
      const activeLimitId = document.getElementById('limitSelect').value;

      if (activeLimitId === 'default') {
        if (joules <= .99) {
          statusBanner.style.backgroundColor = 'rgba(16, 185, 129, 0.1)'; 
          statusBanner.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          statusBanner.style.color = '#34d399'; 
          statusBanner.innerText = 'SMG Full Auto (≤ .99J)';
        } else if (joules <= 1.14) {
          statusBanner.style.backgroundColor = 'rgba(16, 185, 129, 0.1)'; 
          statusBanner.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          statusBanner.style.color = '#34d399'; 
          statusBanner.innerText = 'CQB SAFE (1.00 - 1.14J)';
        } else if (joules <= 1.50) {
          statusBanner.style.backgroundColor = 'rgba(245, 158, 11, 0.1)'; 
          statusBanner.style.borderColor = 'rgba(245, 158, 11, 0.3)';
          statusBanner.style.color = '#fbbf24'; 
          statusBanner.innerText = 'OUTDOOR (1.15 - 1.5J)';
        } else if (joules <= 2.80) {
          statusBanner.style.backgroundColor = 'rgba(239, 68, 68, 0.1)'; 
          statusBanner.style.borderColor = 'rgba(239, 68, 68, 0.3)';
          statusBanner.style.color = '#f87171'; 
          statusBanner.innerText = 'DMR / SNIPER (1.5 - 2.8J)';
        } else {
          statusBanner.style.backgroundColor = '#000000';
          statusBanner.style.borderColor = '#ef4444';
          statusBanner.style.color = '#ef4444';
          statusBanner.innerText = 'BANNED (> 2.8J)';
        }
      } 
      else {
        const allRules = builtInLimits.concat(customLimits);
        const activeRule = allRules.find(limit => limit.id === activeLimitId);
        
        if (activeRule) {
          if (joules <= activeRule.max) {
            statusBanner.style.backgroundColor = 'rgba(16, 185, 129, 0.1)'; 
            statusBanner.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            statusBanner.style.color = '#34d399'; 
            statusBanner.innerHTML = `✅ SAFE <br><span style="font-size:0.8em; font-weight:600; color:var(--text-muted);">${activeRule.field}: ${activeRule.weaponClass}</span>`;
          } else {
            statusBanner.style.backgroundColor = 'rgba(239, 68, 68, 0.1)'; 
            statusBanner.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            statusBanner.style.color = '#f87171'; 
            statusBanner.innerHTML = `❌ HOT (OVER LIMIT) <br><span style="font-size:0.8em; font-weight:600; color:var(--text-muted);">${activeRule.field}: ${activeRule.weaponClass}</span>`;
          }
        }
      }
    }

    function updateJoules() {
      const fps = parseFloat(fpsInput.value);
      const weight = parseFloat(weightInput.value);
      
      if (fps > 0 && weight > 0) {
        const ms = fps * 0.3048;
        const kg = weight / 1000;
        const rawJoules = 0.5 * kg * (ms * ms);
        const displayJoules = rawJoules.toFixed(2); // Round for display
        joulesInput.value = displayJoules;
        updateStatus(parseFloat(displayJoules)); // Fix: Pass the rounded value so it exactly matches the text box
      }
    }

    function updateFPS() {
      const joules = parseFloat(joulesInput.value);
      const weight = parseFloat(weightInput.value);
      
      if (joules > 0 && weight > 0) {
        const kg = weight / 1000;
        const msSquare = joules / (0.5 * kg);
        const ms = Math.sqrt(msSquare);
        const fps = ms / 0.3048;
        fpsInput.value = Math.round(fps);
        updateStatus(joules); // Fix: Evaluate based exactly on the Joules typed in the box
      }
    }

    fpsInput.addEventListener('input', updateJoules);
    weightInput.addEventListener('input', updateJoules); 
    joulesInput.addEventListener('input', updateFPS);


    // --- CHRONO LOG LOGIC ---
    let shotLog = [];

    function logShot() {
      const currentFps = parseFloat(fpsInput.value);
      const currentJoules = parseFloat(joulesInput.value);
      const currentWeight = parseFloat(weightInput.value);

      if (isNaN(currentFps) || isNaN(currentJoules)) return;

      shotLog.unshift({ fps: currentFps, joules: currentJoules, weight: currentWeight });
      if (shotLog.length > 10) shotLog.pop();

      renderLog();
    }

    function clearLog() {
      shotLog = [];
      renderLog();
    }

    function renderLog() {
      const list = document.getElementById('shotList');
      const emptyState = document.getElementById('emptyLogState');
      const averagesBox = document.getElementById('logAverages');
      const clearBtn = document.getElementById('clearLogBtn');
      
      list.innerHTML = ''; 
      
      if (shotLog.length === 0) {
        emptyState.style.display = 'block';
        averagesBox.style.display = 'none';
        clearBtn.style.display = 'none';
      } else {
        emptyState.style.display = 'none';
        averagesBox.style.display = 'flex';
        clearBtn.style.display = 'block';
        
        let totalFps = 0;
        let totalJoules = 0;

        shotLog.forEach((shot, index) => {
          totalFps += shot.fps;
          totalJoules += shot.joules;
          const shotNumber = shotLog.length - index; 

          list.innerHTML += `
            <div class="shot-item">
              <span class="shot-number">#${shotNumber}</span>
              <span class="shot-stats">${shot.fps} FPS</span>
              <span class="shot-stats">${shot.joules.toFixed(2)} J</span>
              <span style="color: var(--text-muted); font-size: 0.9em;">(${shot.weight}g)</span>
            </div>
          `;
        });

        document.getElementById('avgFps').innerText = Math.round(totalFps / shotLog.length);
        document.getElementById('avgJoules').innerText = (totalJoules / shotLog.length).toFixed(2);
      }
    }


    // --- ARMORY (LOCAL STORAGE) LOGIC ---
    let profiles = JSON.parse(localStorage.getItem('airsoftProfiles')) || [];

    function saveProfile() {
      const name = document.getElementById('profileName').value.trim();
      
      if (!name) {
        alert("Please enter a name for this profile (e.g., 'Primary M4').");
        return;
      }

      const newProfile = {
        name: name,
        weight: weightInput.value,
        fps: fpsInput.value,
        joules: joulesInput.value
      };

      profiles.push(newProfile);
      localStorage.setItem('airsoftProfiles', JSON.stringify(profiles));
      
      document.getElementById('profileName').value = '';
      renderProfiles();
    }

    function loadProfile(index) {
      const profile = profiles[index];
      weightInput.value = profile.weight;
      fpsInput.value = profile.fps;
      updateJoules(); 
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProfile(index) {
      if (confirm("Delete this profile?")) {
        profiles.splice(index, 1);
        localStorage.setItem('airsoftProfiles', JSON.stringify(profiles));
        renderProfiles();
      }
    }

    function renderProfiles() {
      const list = document.getElementById('loadoutList');
      const emptyState = document.getElementById('emptyArmoryState');
      
      list.innerHTML = ''; 
      
      if (profiles.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        
        profiles.forEach((profile, index) => {
          list.innerHTML += `
            <div class="loadout-item">
              <div class="loadout-info">
                <span class="loadout-name">${profile.name}</span>
                <span>${profile.weight}g | ${profile.fps} FPS | ${profile.joules}J</span>
              </div>
              <div class="action-btns">
                <button class="action-btn btn-load" onclick="loadProfile(${index})">Load</button>
                <button class="action-btn btn-delete" onclick="deleteProfile(${index})">X</button>
              </div>
            </div>
          `;
        });
      }
    }

    // Initialize everything on page load
    renderLimits();
    renderProfiles();
    renderLog(); 
  </script>

</body>
</html>
